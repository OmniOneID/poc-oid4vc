plugins {
    id 'com.android.application'
}

android {
    namespace 'org.omnione.did.sdk.oid4vc'
    compileSdk 34

    defaultConfig {
        applicationId "org.omnione.did.sdk.oid4vc"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packaging {
        resources {
            excludes += "/log4j2.yml"
        }
    }

}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation("com.squareup.retrofit2:retrofit:2.9.0")
    implementation("com.squareup.okhttp3:logging-interceptor:4.11.0")
    implementation("com.squareup.retrofit2:converter-gson:2.9.0")
    implementation("androidx.gridlayout:gridlayout:1.0.0")

    implementation 'com.fasterxml.jackson.core:jackson-core:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-cbor:2.15.2'

    //zxing
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"

    //Custom tab
    implementation "androidx.browser:browser:1.3.0"

    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'org.slf4j:slf4j-android:1.7.36'

    // BouncyCastle - Required by mDoc SDK
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.76'

    // SpongyCastle - 서명용
    implementation 'com.madgag.spongycastle:core:1.54.0.0'
    implementation 'com.madgag.spongycastle:prov:1.54.0.0'
    implementation 'com.madgag.spongycastle:pkix:1.54.0.0'
    implementation 'com.madgag.spongycastle:pg:1.54.0.0'

    // mDoc
    implementation 'com.upokecenter:cbor:4.5.2'

    // COSE 서명
    // 공식 COSE-JAVA 라이브러리 (JitPack 이용)
    implementation 'com.github.cose-wg:COSE-JAVA:1.1.0'
}
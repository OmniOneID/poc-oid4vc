# OID4VP Repository Configuration
# type: jpa - uses database storage
# type: file - uses file-based storage (reads from JSON files)
oid4vp:
  repository:
    type: jpa

spring:
  jackson:
    default-property-inclusion: non_null
  liquibase:
    change-log: classpath:/db/changelog/master.xml
    enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5430/verifier
    username: omn
    password: omn
  jpa:
    open-in-view: true
    show-sql: true
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    com.example.did.oid4vc.verifier.config.RequestResponseLoggingFilter: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
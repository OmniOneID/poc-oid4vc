plugins {
	id 'java-library'
	id 'org.springframework.boot' version '3.2.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.omnione.did.oid4vc.authorization'
version = '0.0.1-SNAPSHOT'
description = 'OID4VC Authorization for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	springAuthorizationServerVersion = "1.3.1"
	set('springCloudVersion', "2023.0.1")
}

// [중요] 실행 가능한 Fat Jar 생성을 끄고, 일반 라이브러리 Jar 생성
bootJar {
	enabled = false
}

jar {
	enabled = true
	archiveClassifier = '' // plain 등의 접미사 제거
}

dependencies {
	api 'org.springframework.boot:spring-boot-starter-web'
	api 'org.springframework.boot:spring-boot-starter-security'
	api "org.springframework.security:spring-security-oauth2-authorization-server:${springAuthorizationServerVersion}"
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	api 'org.springframework.boot:spring-boot-starter-thymeleaf'

	api 'org.springframework.cloud:spring-cloud-starter-openfeign'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Google login test
	api 'org.springframework.boot:spring-boot-starter-oauth2-client'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

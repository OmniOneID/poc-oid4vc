plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example.did'
version = '1.0.0'
description = 'OID4VC Issuer'


allprojects {
	repositories {
		mavenCentral()
		google()
		maven { url "https://repo.danubetech.com/repository/maven-public/" }
		maven { url "https://maven.scijava.org/content/repositories/public/" }
		maven { url "https://jitpack.io" }
	}
}


java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

jar {
	enabled = false
}
configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

ext {
	set('springCloudVersion', "2023.0.1")
}

springBoot {
	buildInfo()
	mainClass = 'com.example.did.oid4vc.issuer.IssuerApplication'
}



dependencies {
	implementation project(':did-oid4vci-sdk-server')
	implementation project(':did-oid4vc-authorization-sdk-server')
	implementation fileTree(dir: 'libs', include: ['*.jar'])

	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'org.springframework.boot:spring-boot-starter-web-services'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // DB
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.liquibase:liquibase-core'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'com.google.code.gson:gson'

	//인증서 테스트
//	implementation 'org.bouncycastle:bcpkix-jdk15on:1.70'

	// mdoc
	implementation 'com.upokecenter:cbor:4.5.2'

	// COSE 서명
//	implementation 'com.augustcellura:cose-lib:1.1.0'
	// 공식 COSE-JAVA 라이브러리 (JitPack 이용)
	implementation 'com.github.cose-wg:COSE-JAVA:1.1.0'

	// 암호화 알고리즘 (Bouncy Castle)
	implementation 'org.bouncycastle:bcprov-jdk18on:1.76'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

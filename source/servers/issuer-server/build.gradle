plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example.oid4vc'
version = '0.0.1-SNAPSHOT'
description = 'OID4VC Issuer'


allprojects {
	repositories {
		mavenCentral()
		google()
		maven { url "https://repo.danubetech.com/repository/maven-public/" }
		maven { url "https://maven.scijava.org/content/repositories/public/" }
		maven { url "https://jitpack.io" }
	}
}


java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

jar {
	enabled = false
}
configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

ext {
	set('springCloudVersion', "2023.0.1")
}

springBoot {
	buildInfo()
}



dependencies {
	implementation fileTree(dir: 'libs', include: ['*.jar'])
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-web-services'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

//    implementation 'com.apicatalog:titanium-json-ld:1.3.1'
//    implementation 'org.glassfish:jakarta.json:2.0.1'
//    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-cbor:2.15.2'
//	implementation 'com.danubetech:data-integrity-java:1.14.0'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	// QR Image
	implementation 'com.google.zxing:javase:3.5.1'

	// mDL 구현을 위한 의존성
	// CBOR 처리 (Jackson)
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-cbor:2.15.2'
	
	// 암호화 (BouncyCastle) - EC 키 처리, 서명
	implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
	implementation 'org.bouncycastle:bcpkix-jdk15on:1.70'

}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

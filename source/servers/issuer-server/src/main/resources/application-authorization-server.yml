# 서버 배포용 인가 서버 설정
issuer:
  server-ip: 192.168.3.130
  server-port: 8082
  base-url: http://${issuer.server-ip}:${issuer.server-port}

# google login
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "YOUR-ACTUAL-CLIENT-ID"
            client-secret: "YOUR-ACTUAL-SECRET"
            scope:
              - openid
              - profile
              - email

oid4vc:
  auth:
    issuer-url: ${issuer.base-url}
    clients:
      client-id: "oid4vci-client"
      client-secret: "secret"
      redirect-url: ${issuer.base-url}/auth/callback
      redirect-uris:
        - https://oauth.pstmn.io/v1/callback
        - http://localhost:8081/auth/callback
      scopes:
        - openid
        - profile
        - email
        - UniversityDegree
      android:
        client-id: "oid4vci-android"
        redirect-uris:
          - "org.omnione.did.sdk.oid4vc://callback"
        scopes:
          - "openid"
          - "UniversityDegree"
          - "eu.europa.ec.eudi.pid_vc_sd_jwt"
          - "eu.europa.ec.eudi.pid_mdoc"
          - "eu.europa.ec.eudi.mdl_mdoc"
      ios:
        client-id: "oid4vci-ios"
        redirect-uris:
          - "oid4vc-app://callback"
        scopes:
          - "openid"
          - "UniversityDegree"
          - "eu.europa.ec.eudi.pid_mdoc"
          - "eu.europa.ec.eudi.mdl_mdoc"
      issuer-server:
        url: ${issuer.base-url}
server:
  port: 8080

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.liquibase.LiquibaseAutoConfiguration

  config:
    import:
#      - "classpath:application-database-local.yml"
      - "classpath:application-authorization-server-local.yml"
      - "classpath:application-issuer-sdk-local.yml"

logging:
  level:
    root: INFO
    org.omnione.did: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2.server.authorization: TRACE
